<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldLightIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C0" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FBF5B7" />
      <stop offset="75%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#805A19" />
    </linearGradient>

    <linearGradient id="goldShineIcon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="30%" stop-color="#ECC856" />
      <stop offset="70%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#6E4E03" />
    </linearGradient>

    <linearGradient id="goldBevelIcon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C6510" />
      <stop offset="35%" stop-color="#E5C158" />
      <stop offset="60%" stop-color="#FFFDE0" />
      <stop offset="100%" stop-color="#996D13" />
    </linearGradient>

    <radialGradient id="rubyRedIcon" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="40%" stop-color="#E60000" />
      <stop offset="85%" stop-color="#8B0000" />
      <stop offset="100%" stop-color="#3D0000" />
    </radialGradient>

    <radialGradient id="goldGlowIcon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#D4AF37" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>

    <filter id="luxuryShadowIcon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="80" cy="80" r="70" fill="url(#goldGlowIcon)" />
  
  <!-- Outer Ring Badge -->
  <circle cx="80" cy="80" r="74" fill="#121212" stroke="url(#goldLightIcon)" stroke-width="2" />
  <circle cx="80" cy="80" r="68" fill="#0A0A0A" stroke="url(#goldShineIcon)" stroke-width="1" stroke-dasharray="3,3" />

  <!-- EMBLEM -->
  <g transform="translate(0, -2)" filter="url(#luxuryShadowIcon)">
    <!-- Automotive Wings -->
    <path d="M 25,108 C 50,126 110,126 135,108 C 105,116 55,116 25,108 Z" fill="url(#goldBevelIcon)" />
    <path d="M 18,90 C 45,112 115,112 142,90 C 110,102 50,102 18,90 Z" fill="url(#goldShineIcon)" opacity="0.85" />
    
    <!-- Grille Shield -->
    <path d="M 50,108 L 110,108 L 102,128 C 90,136 70,136 58,128 Z" fill="url(#goldLightIcon)" stroke="#523906" stroke-width="1" />
    <line x1="68" y1="110" x2="70" y2="127" stroke="#3D2900" stroke-width="1.5" />
    <line x1="80" y1="110" x2="80" y2="131" stroke="#3D2900" stroke-width="1.8" />
    <line x1="92" y1="110" x2="90" y2="127" stroke="#3D2900" stroke-width="1.5" />

    <!-- Royal Crown Base -->
    <path d="M 45,82 C 67,88 93,88 115,82 L 119,98 C 93,104 67,104 41,98 Z" fill="url(#goldBevelIcon)" stroke="#FFF5C0" stroke-width="0.8" />
    
    <!-- Crown Jewels -->
    <circle cx="53" cy="91" r="3" fill="url(#rubyRedIcon)" stroke="#FFD700" stroke-width="0.8" />
    <circle cx="67" cy="93" r="2.5" fill="#FFFDF0" />
    <circle cx="80" cy="94" r="4" fill="url(#rubyRedIcon)" stroke="#FFD700" stroke-width="1" />
    <circle cx="93" cy="93" r="2.5" fill="#FFFDF0" />
    <circle cx="107" cy="91" r="3" fill="url(#rubyRedIcon)" stroke="#FFD700" stroke-width="0.8" />

    <!-- Crown Peaks -->
    <path d="M 43,82 L 38,52 L 54,70 L 60,83 Z" fill="url(#goldLightIcon)" />
    <path d="M 55,71 L 60,42 L 73,73 Z" fill="url(#goldShineIcon)" />
    <path d="M 70,73 L 80,30 L 90,73 Z" fill="url(#goldBevelIcon)" />
    <path d="M 87,73 L 100,42 L 105,71 Z" fill="url(#goldShineIcon)" />
    <path d="M 100,83 L 106,70 L 122,52 L 117,82 Z" fill="url(#goldLightIcon)" />

    <!-- Peak Jewels -->
    <circle cx="38" cy="50" r="4" fill="url(#rubyRedIcon)" stroke="#FFD700" stroke-width="0.8" />
    <circle cx="60" cy="40" r="4.5" fill="#FFF5C0" stroke="#AA771C" stroke-width="0.8" />
    
    <!-- Star Peak -->
    <g transform="translate(80, 27)">
      <circle cx="0" cy="0" r="6" fill="url(#rubyRedIcon)" stroke="#FFF" stroke-width="1" />
      <polygon points="0,-9 2,-3.5 7,-1.5 2.5,2 4.5,7 0,3.5 -4.5,7 -2.5,2 -7,-1.5 -2,-3.5" fill="url(#goldLightIcon)" />
    </g>
    
    <circle cx="100" cy="40" r="4.5" fill="#FFF5C0" stroke="#AA771C" stroke-width="0.8" />
    <circle cx="122" cy="50" r="4" fill="url(#rubyRedIcon)" stroke="#FFD700" stroke-width="0.8" />
  </g>
  
  <!-- Mini Arabic Typography -->
  <text x="80" y="148" text-anchor="middle" font-family="'Cairo', sans-serif" font-weight="900" font-size="12" fill="url(#goldLightIcon)" letter-spacing="1">
    السـلـطـان
  </text>
</svg>
